        <script>
          (function () {
            "use strict";
            var NS = "http://www.w3.org/2000/svg";
            var SERIES = [
              ["2026-11-16", 9.494775], ["2026-11-17", 9.561391], ["2026-11-18", 9.604424],

            ];
            var W = 1680, H = 560, X_LEFT = 175, X_RIGHT = 1555, Y_TOP = 86, Y_BOT = 428, Y_MIN = 9.4, Y_MAX = 10.2;
            function px(i) { return X_LEFT + (i / (SERIES.length - 1)) * (X_RIGHT - X_LEFT); }
            function py(v) { return Y_BOT - ((v - Y_MIN) / (Y_MAX - Y_MIN)) * (Y_BOT - Y_TOP); }
            var pts = SERIES.map(function (row, i) {
              return { i: i, day: row[0].slice(8) + "/11", fullDay: row[0].slice(8) + "/11/2026", val: row[1], x: px(i), y: py(row[1]) };

            addEl("rect", { x: 115, y: 42, width: 1495, height: 422, rx: 16, fill: "#FFFFFF", "fill-opacity": "0.055" });

            var gridGroup = addEl("g", {});
            [9.4, 9.6, 9.8, 10.0, 10.2].forEach(function (v) {
              var yy = py(v);
              addEl("line", { x1: 125, y1: yy, x2: 1600, y2: yy, stroke: "#FFFFFF", "stroke-opacity": "0.14", "stroke-width": "1.5" }, gridGroup);
              addEl("text", { x: 42, y: yy + 8, fill: "#D4C6E6", "font-family": "Inter, sans-serif", "font-size": "22", "font-weight": "600" }, gridGroup).textContent = v.toFixed(1).replace(".", ",") + " €";
            });
            [0, 2, 4, 6, 8, 10, 11, 12, 14].forEach(function (idx) {
              var p = pts[idx], isEv = idx === 4 || idx === 11 || idx === 14;

            var pathD = pts.map(function (p, i) { return (i ? "L" : "M") + p.x.toFixed(2) + "," + p.y.toFixed(2); }).join(" ");

            var areaEl = addEl("path", { d: areaD, fill: "url(#oc-area-grad)", opacity: "0" });
            var curveEl = addEl("path", { d: pathD, fill: "none", stroke: "#AD89FF", "stroke-width": "7.5", "stroke-linecap": "round", "stroke-linejoin": "round" });
            var totalLen = curveEl.getTotalLength();
            curveEl.style.strokeDasharray = totalLen + " " + totalLen;
            curveEl.style.strokeDashoffset = totalLen;

            var evNodes = [4, 11, 14].map(function (idx) {

            var guidesSvg = document.getElementById("oc-guides");
            var guideGroups = [4, 11, 14].map(function (idx) {
              var sx = 330 + pts[idx].x * 0.75, sy = 342 + pts[idx].y * 0.75;
              var g = addEl("g", { opacity: "0" }, guidesSvg);
              addEl("line", { x1: sx.toFixed(1), y1: "314", x2: sx.toFixed(1), y2: sy.toFixed(1), stroke: "#C7ABFF", "stroke-width": "2.2", "stroke-dasharray": "6 6" }, g);
              addEl("circle", { cx: sx.toFixed(1), cy: sy.toFixed(1), r: "6.5", fill: "#FFFFFF", stroke: "#8861E8", "stroke-width": "3" }, g);
              return g;
            });

            var worldEl = document.getElementById("oc-world");
            var haloEl = document.getElementById("oc-halo");
            var tipPill = document.getElementById("oc-tip-pill");
            var readoutDay = document.getElementById("oc-day");
            var readoutCpm = document.getElementById("oc-cpm");
            var readoutPhase = document.getElementById("oc-phase");

            // Option C starts zoomed IN on 16/11 (2.35x) and gently pushes in (2.55x)
            var cam = { scale: 2.35, focusX: pts[0].x, focusY: pts[0].y, zoomWeight: 0 };
            var drawState = { p: 0 };

            function samplePoint(p) {
              var f = Math.max(0, Math.min(1, p)) * (pts.length - 1);
              var idx = Math.min(pts.length - 2, Math.floor(f)), frac = f - idx;
              var a = pts[idx], b = pts[idx + 1];
              var near = pts[Math.round(f)];
              return { x: a.x + (b.x - a.x) * frac, y: a.y + (b.y - a.y) * frac, val: a.val + (b.val - a.val) * frac, day: near.day, fullDay: near.fullDay };
            }

            function applyState() {
              var cur = samplePoint(drawState.p);
              curveEl.style.strokeDashoffset = (totalLen * (1 - drawState.p)).toFixed(2);
              tipEl.setAttribute("cx", cur.x.toFixed(2));
              tipEl.setAttribute("cy", cur.y.toFixed(2));
              haloEl.style.left = (cur.x - 120).toFixed(1) + "px";
              haloEl.style.top = (cur.y - 120).toFixed(1) + "px";
              tipPill.style.left = Math.min(W - 180, Math.max(20, cur.x - 74)).toFixed(1) + "px";
              tipPill.style.top = (cur.y > 120 ? cur.y - 62 : cur.y + 24).toFixed(1) + "px";
              tipPill.textContent = cur.day + " · " + cur.val.toFixed(2).replace(".", ",") + " €";
              readoutDay.textContent = cur.fullDay;
              readoutCpm.textContent = cur.val.toFixed(2).replace(".", ",") + " €";

              var S = cam.scale, maxTx = (W / 2) * (S - 1), maxTy = (H / 2) * (S - 1);
              var fx = cur.x * cam.zoomWeight + cam.focusX * (1 - cam.zoomWeight);
              var fy = cur.y * cam.zoomWeight + cam.focusY * (1 - cam.zoomWeight);
              var tx = S > 1.001 ? Math.max(-maxTx, Math.min(maxTx, -((fx - W / 2) * S))) : 0;
              var ty = S > 1.001 ? Math.max(-maxTy, Math.min(maxTy, -((fy - H / 2) * S))) : 0;
              worldEl.style.transform = "translate(" + tx.toFixed(2) + "px, " + ty.toFixed(2) + "px) scale(" + S.toFixed(4) + ")";
              readoutPhase.textContent = S > 1.35 ? "Macro ingresso · " + cur.day : "Vista composta";
            }

            gsap.set("#oc-header", { opacity: 0, y: 24 });
            gsap.set("#oc-readout", { opacity: 0, y: 18 });
            gsap.set("#oc-window", { opacity: 0, scale: 0.97, x: 0, y: 0 });
            gsap.set("#oc-origin-chip", { opacity: 0, y: 14, scale: 0.92 });
            gsap.set(haloEl, { opacity: 0.9, scale: 1 });
            gsap.set(tipPill, { opacity: 0, y: 8 });
            gsap.set(["#oc-ev-bw", "#oc-ev-bf", "#oc-ev-cm"], { opacity: 0, y: 18, scale: 0.95 });
            gsap.set(["#oc-m-tim", "#oc-m-cat"], { opacity: 0, y: 40 });
            applyState();

            var tl = gsap.timeline({ paused: true });

            // 1. 0.00-1.75s: Macro entrance ALREADY locked on 16/11 with gentle micro push-in (2.35x -> 2.55x)
            tl.fromTo("#oc-header", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.65, ease: "power3.out" }, 0.04);
            tl.fromTo("#oc-readout", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.12);
            tl.fromTo("#oc-window", { opacity: 0, scale: 0.97, x: 0, y: 0 }, { opacity: 1, scale: 1, x: 0, y: 0, duration: 0.65, ease: "power3.out" }, 0.04);
            tl.fromTo("#oc-origin-chip", { opacity: 0, y: 14, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "power3.out" }, 0.28);
            tl.to(cam, { scale: 2.55, duration: 1.55, ease: "sine.inOut", onUpdate: applyState }, 0.15);

            // 2. 1.75-9.70s: Curve draws while camera glides & progressively widens (2.55x -> 1.72x)
            tl.to("#oc-origin-chip", { opacity: 0, y: -10, duration: 0.45, ease: "power2.in" }, 1.8);
            tl.fromTo(tipPill, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 1.9);
            tl.to(cam, { zoomWeight: 1, scale: 1.72, duration: 7.9, ease: "power1.inOut", onUpdate: applyState }, 1.75);

            tl.fromTo(areaEl, { opacity: 0 }, { opacity: 1, duration: 1.8, ease: "power1.out" }, 2.4);
