<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><style>text{font-family:Inter,Arial,sans-serif;letter-spacing:-1px}.big{font-weight:750}</style><rect width="1600" height="900" fill="#F6F5F9"/><text x="100" y="120" fill="#7046CE" font-size="30">ADERA</text><g class="big" fill="#292339" font-size="98"><text x="100" y="300">E se potessi</text><text x="100" y="415">testare una campagna</text><text x="100" y="530">prima di</text></g><rect x="92" y="565" width="665" height="130" rx="12" fill="#8861E8"/><text x="115" y="660" class="big" fill="white" font-size="100">investirci?</text><g transform="translate(1090 530) rotate(-8)"><rect width="350" height="220" rx="20" fill="white" stroke="#E7E3EE"/><text x="30" y="60" font-size="25" fill="#706A7D">La prossima campagna</text><text x="30" y="125" font-size="42" fill="#7046CE">Prima, capiscila.</text><path d="M30 175h235m-25-16 25 16-25 16" fill="none" stroke="#7046CE" stroke-width="5"/></g></svg>